<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4PCTEAM | Dev Clicker Mini-Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07090e;
            --bg-card: rgba(19, 27, 46, 0.75);
            --accent-cyan: #00ffcc;
            --accent-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
        }

        .ambient-glow {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.15) 0%, rgba(0, 255, 204, 0.05) 60%, transparent 80%);
            top: 20%; left: 50%; transform: translateX(-50%);
            z-index: -1; border-radius: 50%; pointer-events: none; filter: blur(60px);
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-logo {
            font-weight: 800; font-size: 20px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-link {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent-cyan); }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            padding: 0 20px;
            width: 100%;
            max-width: 600px;
        }

        .score-board {
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .score-board h2 {
            font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted);
            margin-bottom: 5px;
        }

        #score {
            font-size: 42px; font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #cps {
            font-size: 12px; color: var(--accent-purple); font-weight: 700; margin-top: 5px;
        }

        /* Clicker Button / Icon */
        .click-area {
            position: relative;
            margin: 20px 0;
        }

        #click-btn {
            width: 180px; height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-surface, #101622), #1a233a);
            border: 3px solid var(--accent-cyan);
            color: #fff;
            font-size: 24px; font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            outline: none;
        }

        #click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        #click-btn span {
            font-size: 12px; color: var(--text-muted); font-weight: 600;
        }

        /* Upgrades Section */
        .upgrades-container {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .upgrades-container h3 {
            font-size: 16px; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 8px;
        }

        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }

        .upgrade-card:hover {
            border-color: rgba(0, 255, 204, 0.3);
        }

        .upgrade-info h4 { font-size: 14px; font-weight: 700; color: #fff; }
        .upgrade-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .buy-btn {
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700; font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-btn:hover:not(:disabled) {
            background: var(--accent-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        footer {
            text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;
            border-top: 1px solid var(--border-color); width: 100%; background: rgba(7,9,14,0.8);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="ambient-glow"></div>

    <nav>
        <a href="index.html" class="nav-logo">4PCTEAM</a>
        <a href="index.html" class="back-link">← Επιστροφή στο Site</a>
    </nav>

    <div class="game-wrapper">
        
        <div class="score-board">
            <h2>Lines of Code</h2>
            <div id="score">0</div>
            <div id="cps">0 γραμμές / δευτερόλεπτο</div>
        </div>

        <div class="click-area">
            <button id="click-btn" onclick="handleClick()">
                💻 <span>Click to Code!</span>
            </button>
        </div>

        <div class="upgrades-container">
            <h3>⚡ Αναβαθμίσεις & Bots</h3>
            
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h4>Auto Scripter (Bot)</h4>
                    <p>Παράγει +1 γραμμή / sec</p>
                </div>
                <button class="buy-btn" id="buy-bot1" onclick="buyUpgrade('bot1')">Αγορά (15)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h4>Roblox Studio Pro</h4>
                    <p>Παράγει +8 γραμμές / sec</p>
                </div>
                <button class="buy-btn" id="buy-bot2" onclick="buyUpgrade('bot2')">Αγορά (100)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h4>Senior Developer AI</h4>
                    <p>Παράγει +45 γραμμές / sec</p>
                </div>
                <button class="buy-btn" id="buy-bot3" onclick="buyUpgrade('bot3')">Αγορά (500)</button>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 4PCTEAM Easter Egg Mini-Game</p>
    </footer>

    <script>
        let score = 0;
        let cps = 0;

        // Στατιστικά αναβαθμίσεων
        const upgrades = {
            bot1: { cost: 15, cpsInc: 1, count: 0 },
            bot2: { cost: 100, cpsInc: 8, count: 0 },
            bot3: { cost: 500, cpsInc: 45, count: 0 }
        };

        function handleClick() {
            score += 1;
            updateDisplay();
        }

        function buyUpgrade(type) {
            if (score >= upgrades[type].cost) {
                score -= upgrades[type].cost;
                cps += upgrades[type].cpsInc;
                upgrades[type].count += 1;
                // Αυξάνουμε το κόστος κατά 15% για την επόμενη αγορά
                upgrades[type].cost = Math.floor(upgrades[type].cost * 1.25);
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('score').innerText = score;
            document.getElementById('cps').innerText = `${cps} γραμμές / δευτερόλεπτο`;

            // Ενημέρωση κουμπιών
            for (let key in upgrades) {
                const btn = document.getElementById(`buy-${key}`);
                btn.innerText = `Αγορά (${upgrades[key].cost})`;
                if (score >= upgrades[key].cost) {
                    btn.removeAttribute('disabled');
                } else {
                    btn.setAttribute('disabled', 'true');
                }
            }
        }

        // Auto-loop παραγωγής κάθε 1 δευτερόλεπτο
        setInterval(() => {
            if (cps > 0) {
                score += cps;
                updateDisplay();
            }
        }, 1000);
    </script>
</body>
</html>
