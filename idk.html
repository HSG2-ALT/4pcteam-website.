<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Discord MediaPipe Tracker</title>
    
    <!-- Σταθερά και δοκιμασμένα CDNs (Δεν σπάνε) -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body { font-family: sans-serif; text-align: center; background: #2f3136; color: white; margin: 0; padding: 20px; }
        #container { position: relative; margin: 20px auto; width: 800px; height: 600px; }
        video { display: none; } /* Κρυφό, παίρνουμε μόνο τα pixels */
        canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 3px solid #5865F2; border-radius: 8px; background: #202225; }
        button { background: #5865F2; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4752C4; }
        #status { color: #faa61a; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Discord Screen Tracker (MediaPipe HTML)</h1>
    <div id="status">Πατήστε το κουμπί και επιλέξτε το παράθυρο του Discord...</div>
    <button id="start-btn">Έναρξη Καταγραφής Παραθύρου</button>

    <div id="container">
        <video id="input-video" autoplay playsinline muted></video>
        <canvas id="output-canvas" width="800" height="600"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');

        // Ρύθμιση του Holistic Μοντέλου (Σώμα, Χέρια, Μάτια/Πρόσωπο)
        const holistic = new Holistic({
            locateFile: (file) => {
                return `https://jsdelivr.net{file}`;
            }
        });

        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Αυτό τρέχει κάθε φορά που το MediaPipe βρίσκει σκελετό/μάτια/χέρια
        holistic.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Σχεδίαση της εικόνας του Discord στο background
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 1. Σχεδίαση Προσώπου & Ματιών (Μπλε)
            if (results.faceLandmarks) {
                drawConnectors(canvasCtx, results.faceLandmarks, FACEMESH_CONTOURS, {color: '#00FFFF', lineWidth: 1});
            }
            
            // 2. Σχεδίαση Σώματος / Pose (Πράσινο)
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#00FF00', lineWidth: 1, radius: 2});
            }

            // 3. Σχεδίαση Αριστερού Χεριού (Κόκκινο)
            if (results.leftHandLandmarks) {
                drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, {color: '#FF0000', lineWidth: 2});
                drawLandmarks(canvasCtx, results.leftHandLandmarks, {color: '#FF0000', lineWidth: 1, radius: 2});
            }

            // 4. Σχεδίαση Δεξιού Χεριού (Κόκκινο)
            if (results.rightHandLandmarks) {
                drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, {color: '#FF0000', lineWidth: 2});
                drawLandmarks(canvasCtx, results.rightHandLandmarks, {color: '#FF0000', lineWidth: 1, radius: 2});
            }
            
            canvasCtx.restore();
        });

        // Event για το κουμπί
        startBtn.addEventListener('click', async () => {
            try {
                // Ζητάει από τον browser να επιλέξεις παράθυρο
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: "window" },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                statusDiv.innerText = "Το μοντέλο επεξεργάζεται το παράθυρο...";
                statusDiv.style.color = "#43b581";

                // Στέλνουμε τα frames για ανάλυση
                async function onFrame() {
                    if (!videoElement.paused && !videoElement.ended) {
                        await holistic.send({ image: videoElement });
                    }
                    requestAnimationFrame(onFrame);
                }

                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    onFrame();
                };

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Αποτυχία πρόσβασης στο παράθυρο.";
                statusDiv.style.color = "#f04747";
            }
        });
    </script>
</body>
</html>
