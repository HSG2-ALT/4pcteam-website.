<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Σελίδα δεν βρέθηκε | 4PCTEAM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05070a;
            --accent-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 255, 204, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.12) 0%, rgba(157, 78, 221, 0.06) 50%, transparent 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
        }

        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        h1 {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 700;
            margin-bottom: 14px;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 480px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-cyan);
            color: var(--bg-deep);
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px var(--border-glow);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px var(--border-glow);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="error-code">404</div>
    <h1>Η σελίδα δεν βρέθηκε</h1>
    <p>Ο σύνδεσμος που ακολούθησες δεν υπάρχει ή έχει μετακινηθεί σε νέα διεύθυνση.</p>

    <!-- Κουμπί Επιστροφής στην Αρχική -->
    <a href="/" class="btn-home">Return to Home Page</a>

    <script>
        // Interactive Canvas Particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            draw() {
                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numParticles = (canvas.width * canvas.height) / 12000;
            for (let i = 0; i < numParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
